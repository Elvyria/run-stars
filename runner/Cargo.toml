[package]
name = "run-stars"
version = "0.1.0"
authors = ["Elvyria <elvyria@tutanota.com>"]
repository = "https://github.com/Elvyria/run-stars"
edition = "2021"

[dependencies]
argh = "0.1.19"
async-channel = "2.5.0"
async-process = "2.5.0"
